<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover makes it look right on iPhones with a notch -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1769FF" />
  <title>Hydration Buddy</title>

  <!-- iOS Home Screen requirements -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Water 💧" />
  <link rel="apple-touch-icon" href="icon-180.png" />

  <!-- PWA manifest + icons -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">

    <h1 class="title">Hydration Buddy</h1>

    <!-- Progress ring -->
    <div class="ring-wrap" role="img" aria-label="Daily water progress">
      <svg class="ring" viewBox="0 0 200 200">
        <circle class="ring-bg" cx="100" cy="100" r="84" />
        <circle class="ring-fg" id="ringFg" cx="100" cy="100" r="84" />
      </svg>
      <div class="ring-text">
        <span class="ring-count" id="countToday">0</span>
        <span class="ring-goal">/ 8 glasses</span>
        <span class="ring-label">today</span>
      </div>
    </div>

    <!-- Encouraging line -->
    <p class="encourage" id="encourageLine">Let's get started — first glass of the day! 💧</p>

    <!-- Big log button -->
    <button class="btn-log" id="logBtn">Log a Glass</button>

    <!-- Reminders -->
    <button class="btn-enable" id="enableBtn">Enable Reminders</button>
    <p class="status" id="statusLine"></p>

  </main>

  <script src="app.js"></script>
</body>
</html>
